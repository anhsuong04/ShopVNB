<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Trang không tồn tại</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            padding: 20px;
        }

        .error-container h1 {
            font-size: 10rem;
            color: #e60023;
        }

        .error-container h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .error-container p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #555;
        }

        .error-container a {
            text-decoration: none;
            background: #e60023;
            color: #fff;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .error-container a:hover {
            background: #c5001f;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-container h1 {
                font-size: 6rem;
            }

            .error-container h2 {
                font-size: 1.5rem;
            }

            .error-container p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! Trang không tồn tại</h2>
        <p>Xin lỗi, trang bạn tìm kiếm không còn tồn tại hoặc đã được di chuyển.</p>
        <a href="/SHOPVNB/index.php">Quay về trang chủ</a>
    </div>
</body>
</html>
